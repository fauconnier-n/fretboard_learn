# Checks on every pull request to main and on main itself. A published release (vX.Y.Z) runs the
# checks and then deploys that tag to GitHub Pages (https://fauconnier-n.github.io/fretboard_learn/),
# so the site always runs the latest release. Only the app's files are published: no docs, tools,
# tests or server script.
name: Check and deploy
run-name: ${{ github.event_name == 'release' && format('Deploy {0}', github.event.release.tag_name) || format('Check {0}', github.ref_name) }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'release' && 'deploy' || github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
  deploy:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the app files only, stamped with the release tag
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          sed -i "s/export const VERSION = 'dev';/export const VERSION = '${{ github.event.release.tag_name }}';/" _site/js/version.js
          grep -q "${{ github.event.release.tag_name }}" _site/js/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
